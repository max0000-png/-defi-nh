<style>
:root{
  --ink:#0B1013;--panel:#131C20;--panel2:#1B262B;--raise:#233238;
  --text:#E6EDEF;--muted:#8FA3A8;--line:rgba(199,205,209,.14);
  --teal:#3FA89E;--teal-deep:#1E5A57;--amber:#F0A93B;--amber-deep:#7A5416;
  --red:#E0574B;--ok:#5BC98B;
  --r:14px;--r-lg:22px;--shadow:0 18px 50px -20px rgba(0,0,0,.75);
  --display:"IBM Plex Sans Condensed",Impact,sans-serif;
  --body:"IBM Plex Sans",-apple-system,sans-serif;
  --mono:"IBM Plex Mono",monospace;
}
html[data-theme=light]{
  --ink:#EDF1F0;--panel:#fff;--panel2:#E5EBEA;--raise:#F5F8F7;
  --text:#0D1618;--muted:#5A6E73;--line:rgba(13,22,24,.13);
  --teal:#1C7B72;--teal-deep:#BFE0DC;--amber:#B87614;--amber-deep:#F6E2BC;
  --red:#B93A2F;--ok:#2E8A57;--shadow:0 18px 44px -24px rgba(13,22,24,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ink);color:var(--text);font-family:var(--body);-webkit-font-smoothing:antialiased;font-size:16px;line-height:1.55;min-height:100dvh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.55;background:radial-gradient(60% 45% at 50% -10%,color-mix(in srgb,var(--teal) 18%,transparent),transparent 70%),radial-gradient(45% 35% at 100% 100%,color-mix(in srgb,var(--amber) 10%,transparent),transparent 70%)}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:-.01em;margin:0;line-height:1.02}
h1{font-size:clamp(2.6rem,10vw,4.6rem);text-transform:uppercase}
h2{font-size:clamp(1.6rem,5.4vw,2.5rem);text-transform:uppercase}
h3{font-size:1.18rem;letter-spacing:0}
p{margin:0 0 .9rem}
a{color:var(--teal)}
button{font-family:var(--body)}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px;border-radius:6px}
.eyebrow{font-family:var(--mono);font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:.6rem;margin-bottom:.9rem}
.eyebrow::after{content:"";height:1px;flex:1;background:var(--line)}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px;position:relative;z-index:1}
.muted{color:var(--muted)}.small{font-size:.86rem}
header.top{position:sticky;top:0;z-index:40;backdrop-filter:blur(14px);background:color-mix(in srgb,var(--ink) 82%,transparent);border-bottom:1px solid var(--line)}
.top-in{max-width:1040px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;background:none;border:0;padding:0;color:inherit}
.logo-mark{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none;background:linear-gradient(150deg,var(--teal),var(--teal-deep));font-family:var(--display);font-size:.95rem;color:#04100F;letter-spacing:-.02em}
.logo-txt{font-family:var(--display);font-size:1.05rem;text-transform:uppercase;letter-spacing:.02em;line-height:1}
.logo-txt span{display:block;font-family:var(--mono);font-size:.58rem;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin-top:2px}
.top nav{margin-left:auto;display:flex;align-items:center;gap:4px}
.ghost{background:transparent;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:8px 12px;font-size:.84rem;cursor:pointer;transition:.16s}
.ghost:hover{border-color:var(--teal);color:var(--teal)}
.ghost.icon{padding:8px 10px;line-height:1}
@media(max-width:620px){.hide-sm{display:none}}
.screen{display:none;padding:34px 0 70px}
.screen.on{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hero{padding:22px 0 6px}
.hero h1{margin:.2rem 0 .6rem}
.hero h1 em{font-style:normal;color:var(--amber)}
.lede{font-size:1.1rem;max-width:46ch;color:var(--muted)}
.cta-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px;align-items:center}
.btn{border:0;border-radius:12px;padding:16px 26px;cursor:pointer;font-weight:600;font-size:1rem;background:var(--teal);color:#04100F;transition:transform .12s,filter .16s;letter-spacing:.01em}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.97)}
.btn.big{padding:20px 40px;font-size:1.12rem;font-family:var(--display);text-transform:uppercase;letter-spacing:.04em}
.btn.amber{background:var(--amber);color:#1B1204}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--text)}.btn.line:hover{border-color:var(--teal)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none;transform:none}
.plays{font-family:var(--mono);font-size:.82rem;color:var(--muted)}.plays b{color:var(--amber)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:46px 0 10px}
@media(max-width:700px){.steps{grid-template-columns:1fr}}
.step{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.step .n{font-family:var(--mono);font-size:.72rem;color:var(--amber);letter-spacing:.18em;margin-bottom:8px}
.step h3{margin-bottom:6px}.step p{margin:0;color:var(--muted);font-size:.92rem}
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:700px){.tiers{grid-template-columns:1fr}}
.tier{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;position:relative;overflow:hidden}
.tier::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--bar,var(--muted))}
.tier[data-t=bronze]{--bar:#B0704A}.tier[data-t=argent]{--bar:#A9B7BC}.tier[data-t=or]{--bar:var(--amber)}
.tier .req{font-family:var(--mono);font-size:.72rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.tier ul{margin:10px 0 0;padding-left:18px;color:var(--muted);font-size:.9rem}.tier li{margin-bottom:4px}
.section{margin-top:56px}
.hud{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.stat{font-family:var(--mono)}.stat b{display:block;font-size:1.5rem;color:var(--text);line-height:1.1}
.stat span{font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.lives{margin-left:auto;display:flex;gap:6px}
.life{width:13px;height:13px;border-radius:50%;background:var(--teal);box-shadow:0 0 12px color-mix(in srgb,var(--teal) 60%,transparent)}
.life.dead{background:var(--line);box-shadow:none}
.bench{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px 18px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden;touch-action:manipulation;user-select:none;cursor:pointer}
.board{position:relative;z-index:1;display:grid;grid-template-columns:repeat(10,1fr);gap:9px;padding:16px;border:1px solid var(--line);border-radius:12px;margin-bottom:22px;background:color-mix(in srgb,var(--teal-deep) 22%,var(--panel2));min-height:120px;align-content:start}
@media(max-width:520px){.board{grid-template-columns:repeat(6,1fr)}}
.screw{aspect-ratio:1;border-radius:50%;border:1px dashed var(--line);opacity:.35}
.screw.set{opacity:1;border:0;background:radial-gradient(circle at 32% 30%,#F7DDA6,var(--amber) 55%,var(--amber-deep));box-shadow:0 0 14px color-mix(in srgb,var(--amber) 45%,transparent);animation:pop .28s ease}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
.rail-label{font-family:var(--mono);font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;position:relative;z-index:1}
.rail{position:relative;z-index:1;height:64px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
.zone{position:absolute;top:0;bottom:0;border-radius:6px;background:linear-gradient(180deg,color-mix(in srgb,var(--amber) 55%,transparent),color-mix(in srgb,var(--amber) 22%,transparent));border-left:2px solid var(--amber);border-right:2px solid var(--amber)}
.zone .core{position:absolute;left:50%;top:0;bottom:0;width:2px;background:color-mix(in srgb,var(--text) 55%,transparent);transform:translateX(-50%)}
.cursor{position:absolute;top:-4px;bottom:-4px;width:5px;margin-left:-2.5px;border-radius:3px;background:var(--text);box-shadow:0 0 18px color-mix(in srgb,var(--text) 50%,transparent)}
.rail.hit{animation:flashOk .25s ease}.rail.miss{animation:flashBad .3s ease}
@keyframes flashOk{50%{background:color-mix(in srgb,var(--teal) 40%,var(--panel2))}}
@keyframes flashBad{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}50%{background:color-mix(in srgb,var(--red) 30%,var(--panel2))}}
.tap-hint{text-align:center;margin-top:16px;font-family:var(--mono);font-size:.78rem;letter-spacing:.1em;color:var(--muted);position:relative;z-index:1}
.floater{position:absolute;left:50%;top:44%;transform:translateX(-50%);z-index:3;pointer-events:none;font-family:var(--display);font-size:2rem;text-transform:uppercase;color:var(--amber);opacity:0}
.floater.go{animation:float .7s ease forwards}
@keyframes float{0%{opacity:1;transform:translate(-50%,0) scale(.8)}100%{opacity:0;transform:translate(-50%,-46px) scale(1.1)}}
.countdown{position:absolute;inset:0;z-index:5;display:grid;place-items:center;backdrop-filter:blur(3px);background:color-mix(in srgb,var(--ink) 72%,transparent);font-family:var(--display);font-size:5rem;color:var(--amber)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:26px;box-shadow:var(--shadow);max-width:640px;margin:0 auto}
.score-big{font-family:var(--display);font-size:clamp(4rem,18vw,7rem);line-height:.9;color:var(--amber);text-align:center}
.score-lbl{text-align:center;font-family:var(--mono);font-size:.72rem;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-bottom:22px}
.badge{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;font-family:var(--mono);font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--line);background:var(--panel2)}
.badge i{width:9px;height:9px;border-radius:50%;background:var(--amber);font-style:normal}
.prize{margin:22px 0;padding:20px;border-radius:var(--r);border:1px dashed var(--amber);background:color-mix(in srgb,var(--amber) 8%,transparent);text-align:center}
.prize .n{font-family:var(--display);font-size:1.9rem;text-transform:uppercase;line-height:1.05;margin:6px 0}
.divider{height:1px;background:var(--line);margin:22px 0}
label{display:block;font-size:.82rem;color:var(--muted);margin:0 0 6px;font-weight:500}
input,select,textarea{width:100%;padding:13px 14px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-family:var(--body);font-size:1rem}
input:focus,select:focus{border-color:var(--teal);outline:none}
.field{margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.check{display:flex;gap:11px;align-items:flex-start;margin-bottom:13px;font-size:.88rem;line-height:1.45;color:var(--muted)}
.check input{margin-top:3px;width:19px;height:19px;accent-color:var(--teal);flex:none}
.err{color:var(--red);font-size:.85rem;min-height:1.2em;margin-bottom:8px}
.ticket{background:var(--panel2);border:1px solid var(--amber);border-radius:var(--r);padding:26px 20px;text-align:center;position:relative;margin:6px 0 20px}
.ticket::before,.ticket::after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:var(--panel);top:50%;transform:translateY(-50%);border:1px solid var(--amber)}
.ticket::before{left:-12px;clip-path:inset(0 0 0 50%)}.ticket::after{right:-12px;clip-path:inset(0 50% 0 0)}
.code{font-family:var(--mono);font-weight:600;font-size:clamp(2rem,10vw,2.9rem);letter-spacing:.2em;color:var(--amber);margin:8px 0 4px;word-break:break-all}
.conds{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.conds ul{margin:8px 0 0;padding-left:20px;color:var(--muted);font-size:.9rem}.conds li{margin-bottom:6px}
.actions{display:grid;gap:10px;margin-top:20px}
.action{display:flex;align-items:center;gap:13px;padding:15px 16px;border-radius:12px;cursor:pointer;background:var(--panel2);border:1px solid var(--line);color:var(--text);text-align:left;width:100%;font-size:.95rem}
.action:hover{border-color:var(--teal)}.action .ic{width:34px;height:34px;border-radius:9px;background:var(--raise);display:grid;place-items:center;flex:none;font-size:1.05rem}
.action .gain{margin-left:auto;font-family:var(--mono);font-size:.74rem;color:var(--amber);white-space:nowrap}
.action.done{opacity:.5;cursor:default}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{text-align:left;font-family:var(--mono);font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:400;padding:10px 8px;border-bottom:1px solid var(--line)}
td{padding:12px 8px;border-bottom:1px solid var(--line)}
tbody tr:hover{background:var(--panel2)}
.rank{font-family:var(--mono);color:var(--muted);width:44px}
tr.top1 .rank,tr.top1 td:nth-child(2){color:var(--amber);font-weight:600}
.pts{font-family:var(--mono);text-align:right}
.empty{padding:34px 10px;text-align:center;color:var(--muted);font-size:.92rem}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:22px;border-bottom:1px solid var(--line);padding-bottom:12px}
.tab{background:transparent;border:1px solid transparent;color:var(--muted);padding:8px 13px;border-radius:9px;cursor:pointer;font-size:.88rem}
.tab.on{background:var(--panel2);color:var(--text);border-color:var(--line)}
.pane{display:none}.pane.on{display:block}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
@media(max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.kpi b{display:block;font-family:var(--display);font-size:2rem;line-height:1;color:var(--teal)}
.kpi span{font-family:var(--mono);font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.bar-row{display:flex;align-items:center;gap:12px;margin-bottom:9px;font-size:.88rem}
.bar-row .lbl{width:96px;color:var(--muted);flex:none}
.bar-track{flex:1;height:9px;background:var(--panel2);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;background:var(--teal);border-radius:99px}
.adm-list{display:grid;gap:10px}
.adm-item{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.adm-item .nm{font-weight:600}.adm-item .meta{font-family:var(--mono);font-size:.74rem;color:var(--muted)}
.adm-item .sp{margin-left:auto;display:flex;gap:6px}
.mini{padding:6px 10px;font-size:.78rem;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer}
.mini:hover{border-color:var(--teal)}.mini.danger:hover{border-color:var(--red);color:var(--red)}
.pill{font-family:var(--mono);font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:99px;border:1px solid var(--line)}
.pill.off{opacity:.5}.pill.bronze{color:#C7845A;border-color:#C7845A}.pill.argent{color:#A9B7BC;border-color:#A9B7BC}.pill.or{color:var(--amber);border-color:var(--amber)}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.modal{position:fixed;inset:0;z-index:90;display:none;place-items:center;padding:20px;background:color-mix(in srgb,#000 65%,transparent);backdrop-filter:blur(6px)}
.modal.on{display:grid}
.modal-in{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);max-width:720px;width:100%;max-height:86dvh;overflow-y:auto;padding:28px}
.modal-in h2{margin-bottom:14px}.modal-in h3{margin:22px 0 8px;color:var(--teal)}
.modal-in p,.modal-in li{font-size:.92rem;color:var(--muted)}
.close-x{position:sticky;top:0;float:right;background:var(--panel2);border:1px solid var(--line);color:var(--text);width:34px;height:34px;border-radius:9px;cursor:pointer;font-size:1rem}
footer{border-top:1px solid var(--line);margin-top:60px;padding:26px 0 40px;position:relative;z-index:1}
.foot-links{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.84rem;margin-bottom:14px}
.foot-links button{background:none;border:0;color:var(--muted);cursor:pointer;padding:0;font-size:.84rem}
.foot-links button:hover{color:var(--teal)}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,80px);z-index:100;background:var(--raise);border:1px solid var(--teal);color:var(--text);padding:13px 20px;border-radius:12px;font-size:.9rem;opacity:0;transition:.28s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{transform:translate(-50%,0);opacity:1}
.loading-overlay{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:var(--ink)}
.loading-overlay.hide{display:none}
.spinner{width:44px;height:44px;border:3px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div style="text-align:center">
    <div class="spinner"></div>
    <p style="color:var(--muted);font-family:var(--mono);font-size:.8rem;margin-top:14px;letter-spacing:.1em">CHARGEMENT…</p>
  </div>
</div>

<header class="top">
  <div class="top-in">
    <button class="logo" id="logoBtn">
      <span class="logo-mark">NH</span>
      <span class="logo-txt">Le Défi NH<span>NH Réparation</span></span>
    </button>
    <nav>
      <button class="ghost hide-sm" data-go="home">Accueil</button>
      <button class="ghost hide-sm" data-go="board">Classement</button>
      <button class="ghost icon" id="soundBtn">♪</button>
      <button class="ghost icon" id="themeBtn">◐</button>
    </nav>
  </div>
</header>

<main class="wrap">

<section class="screen on" id="s-home">
  <div class="hero">
    <div class="eyebrow">Hermanville-sur-Mer · Jeu gratuit</div>
    <h1>Tu as la main<br><em>d'un réparateur ?</em></h1>
    <p class="lede">Pose les vis au bon moment. Plus ta précision est haute, plus ton cadeau est gros. Tout le monde repart avec quelque chose.</p>
    <div class="cta-row">
      <button class="btn big amber" id="playBtn">Jouer — 30 secondes</button>
      <span class="plays" id="playsLeft"></span>
    </div>
  </div>

<script>
/* =====================================================================
   LE DÉFI NH — Version production avec Supabase
   Données persistantes, multi-appareils, conformes RGPD

// ── Supabase API ──────────────────────────────────────────────────────
async function sbFetch(path, opts = {}, useService = false) {
  const key = useService ? SUPABASE_SERVICE : SUPABASE_ANON;
  const r = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
    headers: {
      'apikey': key,
      'Authorization': 'Bearer ' + key,
      'Content-Type': 'application/json',
      'Prefer': opts.prefer || 'return=representation',
      ...opts.headers
    },
    method: opts.method || 'GET',
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  if (!r.ok) { const e = await r.text(); throw new Error(e); }
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}
const sbGet    = (t, q='')          => sbFetch(t + '?' + q);
const sbPost   = (t, b, svc=false)  => sbFetch(t, {method:'POST', body:b, prefer:'return=representation'}, svc);
const sbPatch  = (t, q, b, svc=false) => sbFetch(t+'?'+q, {method:'PATCH', body:b, prefer:'return=representation'}, svc);
const sbDelete = (t, q, svc=false)  => sbFetch(t+'?'+q, {method:'DELETE', prefer:'return=representation'}, svc);

// ── Utilitaires ───────────────────────────────────────────────────────
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const today = () => new Date().toISOString().slice(0,10);
function isoWeek(d=new Date()){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));t.setUTCDate(t.getUTCDate()+4-(t.getUTCDay()||7));const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return t.getUTCFullYear()+'-S'+String(Math.ceil(((t-y0)/864e5+1)/7)).padStart(2,'0');}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2600);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function makeCode(){const A='ACDEFHJKLMNPRTUVWXY3479';return Array.from({length:6},()=>A[Math.floor(Math.random()*A.length)]).join('');}
function fmtDate(ts){return new Date(ts).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'});}

// Fingerprint léger (pas de PII) pour limiter les parties par appareil
function getSession(){let s=localStorage.getItem('nh_sid');if(!s){s=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem('nh_sid',s);}return s;}
const SESSION = getSession();

// ── État global ───────────────────────────────────────────────────────
let CFG = null, PRIZES = [], SETTINGS = {};
let BOARD = [], CLAIMS = [], STATS = {};
let todayPlays = 0, bonusPlays = 0;
const DONE_BONUSES = JSON.parse(localStorage.getItem('nh_done')||'{}');
const saveDone = () => localStorage.setItem('nh_done', JSON.stringify(DONE_BONUSES));

// ── Sons ──────────────────────────────────────────────────────────────
const SFX=(()=>{let ctx=null,on=true;const ac=()=>{if(!ctx){const C=window.AudioContext||window.webkitAudioContext;if(C)ctx=new C();}if(ctx&&ctx.state==='suspended')ctx.resume();return ctx;};function tone(freq,dur,type='sine',vol=.18,slide=0){if(!on)return;const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(freq,c.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide),c.currentTime+dur);g.gain.setValueAtTime(0,c.currentTime);g.gain.linearRampToValueAtTime(vol,c.currentTime+.012);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+dur);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+dur+.02);}function buzz(ms){if(on&&navigator.vibrate)try{navigator.vibrate(ms);}catch(e){}}return{toggle(){on=!on;if(on)tone(880,.1,'triangle',.15);return on;},hit(s){tone(520+Math.min(s,12)*42,.11,'triangle',.16,120);buzz(12);},perfect(s){tone(660+Math.min(s,12)*42,.1,'square',.12,200);setTimeout(()=>tone(1046,.16,'triangle',.14),55);buzz([10,24,14]);},miss(){tone(180,.26,'sawtooth',.14,-90);buzz(90);},count(){tone(440,.09,'sine',.13);},go(){tone(880,.18,'triangle',.16,180);},over(){tone(320,.2,'sine',.15,-110);setTimeout(()=>tone(210,.38,'sine',.13,-70),150);buzz([40,60,40]);},win(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.22,'triangle',.14),i*95));buzz([20,40,20,40,60]);}};})();

// ── Chargement initial ────────────────────────────────────────────────
async function boot() {
  try {
    // Charger config depuis Supabase
    const rows = await sbGet('config', 'select=key,value');
    rows.forEach(r => { if(r.key==='settings') SETTINGS=r.value; if(r.key==='prizes') PRIZES=r.value; });

    // Parties jouées aujourd'hui par cet appareil
    const playsToday = await sbGet('plays', `session_id=eq.${SESSION}&played_at=gte.${today()}T00:00:00&valid=eq.true&select=id`);
    todayPlays = playsToday.length;

    // Classement semaine
    BOARD = await sbGet('leaderboard', `iso_week=eq.${isoWeek()}&order=score.desc&limit=50`);

    // Stats (vue)
    const statsRows = await sbGet('stats', 'select=*');
    STATS = statsRows[0] || {};

    // Claims pour back-office (chargé à la demande)

  } catch(e) {
    console.warn('Supabase non configuré, mode démo local:', e.message);
    // Fallback: mode démo si Supabase pas encore configuré
    SETTINGS = {pin:'1234',thresholds:{argent:250,or:600},playsPerDay:1,validityDays:30,jackpot:"une réparation d'écran offerte",conditions:["Cadeau à retirer uniquement à l'atelier NH Réparation.","Présente ton code au comptoir.","Un seul cadeau par personne et par semaine.","Offre non échangeable et non remboursable."],links:{review:'#',fb:'#',ig:'#',site:'https://jeu.nhreparation.fr'},legal:{raison:'NH Réparation',siret:'000 000 000 00000',adresse:'Hermanville-sur-Mer',tel:'00 00 00 00 00',mail:'contact@nhreparation.fr'}};
    PRIZES=[{id:'p1',name:'Câble USB-C 1 m',tier:'bronze',stock:40,weight:30,value:'4,90 €',exp:'',active:true},{id:'p2',name:'Verre trempé posé',tier:'bronze',stock:30,weight:25,value:'9,90 €',exp:'',active:true},{id:'p3',name:'-10 % sur ta prochaine réparation',tier:'bronze',stock:200,weight:20,value:'—',exp:'',active:true},{id:'p5',name:'Chargeur secteur 20 W',tier:'argent',stock:20,weight:30,value:'14,90 €',exp:'',active:true},{id:'p6',name:'Coque au choix',tier:'argent',stock:25,weight:30,value:'12,90 €',exp:'',active:true},{id:'p9',name:'Écouteurs Bluetooth',tier:'or',stock:8,weight:25,value:'29,90 €',exp:'',active:true},{id:'p10',name:'-20 % sur une réparation',tier:'or',stock:40,weight:35,value:'—',exp:'',active:true}];
    todayPlays = parseInt(localStorage.getItem('nh_today_'+today())||'0');
    BOARD = JSON.parse(localStorage.getItem('nh_board')||'[]');
  }

  const th = localStorage.getItem('nh_theme');
  if(th) document.documentElement.dataset.theme = th;
  $('#loadingOverlay').classList.add('hide');
  renderHome(); renderBoard(); refreshPlays(); renderFooter();
}

// ── Navigation ────────────────────────────────────────────────────────
function go(id){$$('.screen').forEach(s=>s.classList.remove('on'));$('#s-'+id).classList.add('on');window.scrollTo({top:0,behavior:'smooth'});}
$$('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));
$('#themeBtn').addEventListener('click',()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;localStorage.setItem('nh_theme',t);});
$('#soundBtn').addEventListener('click',()=>{const on=SFX.toggle();$('#soundBtn').textContent=on?'♪':'♪';$('#soundBtn').style.opacity=on?'1':'.45';toast(on?'Son activé.':'Son coupé.');});
let lc=0,lt;$('#logoBtn').addEventListener('click',()=>{lc++;clearTimeout(lt);lt=setTimeout(()=>lc=0,900);if(lc>=5){lc=0;go('admin');}else if(lc===1){setTimeout(()=>{if(lc===1)go('home');},950);}});

// ── Parties disponibles ───────────────────────────────────────────────
function playsLeft(){return Math.max(0,(SETTINGS.playsPerDay||1)+bonusPlays-todayPlays);}
function refreshPlays(){const n=playsLeft();$('#playsLeft').innerHTML=n>0?`<b>${n}</b> partie${n>1?'s':''} restante${n>1?'s':''} aujourd'hui`:'Plus de partie aujourd\'hui — reviens demain';$('#playBtn').disabled=n===0;}

// ── Accueil ───────────────────────────────────────────────────────────
function renderHome(){
  const tiers=[{k:'bronze',t:'Bronze',r:'Dès la première vis'},{k:'argent',t:'Argent',r:`À partir de ${SETTINGS.thresholds?.argent||250} points`},{k:'or',t:'Or',r:`À partir de ${SETTINGS.thresholds?.or||600} points`}];
  $('#tierCards').innerHTML=tiers.map(t=>{const list=PRIZES.filter(p=>p.tier===t.k&&p.active);return `<div class="tier" data-t="${t.k}"><div class="req">${esc(t.r)}</div><h3 style="margin:6px 0 0">${t.t}</h3><ul>${list.length?list.map(p=>`<li class="${p.stock>0?'':'out'}">${esc(p.name)}${p.stock>0?'':' — épuisé'}</li>`).join(''):'<li>Bientôt disponible</li>'}</ul></div>`;}).join('');
  $('#jackpotTxt').textContent=SETTINGS.jackpot||'une réparation d\'écran offerte';
  $('#jackpotTxt2').textContent=SETTINGS.jackpot||'une réparation d\'écran offerte';
  $('#homeBoard').innerHTML=boardHtml(BOARD.slice(0,5));
}
function renderFooter(){const L=SETTINGS.legal||{};$('#footNote').textContent=`${L.raison||'NH Réparation'} — ${L.adresse||''} · Jeu gratuit sans obligation d'achat.`;}
function boardHtml(rows){if(!rows.length)return '<div class="empty">Personne cette semaine. La première place est libre.</div>';return `<table><thead><tr><th>#</th><th>Joueur</th><th style="text-align:right">Score</th></tr></thead><tbody>${rows.map((r,i)=>`<tr class="${i===0?'top1':''}"><td class="rank">${i+1}</td><td>${esc(r.display_name)}</td><td class="pts">${r.score}</td></tr>`).join('')}</tbody></table>`;}

const G={running:false,pos:0,dir:1,speed:.55,zoneC:.5,zoneW:.30,score:0,hits:0,streak:0,lives:3,last:0,raf:0};
const SCREWS=60;
$('#board').innerHTML=Array.from({length:SCREWS},()=>'<div class="screw"></div>').join('');
$('#playBtn').addEventListener('click',()=>{if(playsLeft()>0)go('rules');});

function startGame(){go('game');Object.assign(G,{running:false,pos:0,dir:1,speed:.55,zoneW:.30,score:0,hits:0,streak:0,lives:3});updateHud();newZone();$$('.screw').forEach(s=>s.classList.remove('set'));let n=3;const cd=$('#countdown');cd.style.display='grid';cd.textContent=n;SFX.count();const iv=setInterval(()=>{n--;if(n===0){cd.textContent='GO';SFX.go();}else if(n<0){clearInterval(iv);cd.style.display='none';G.running=true;G.last=performance.now();G.raf=requestAnimationFrame(loop);}else{cd.textContent=n;SFX.count();}},700);}
function newZone(){G.zoneC=.12+Math.random()*.76;const z=$('#zone');z.style.left=((G.zoneC-G.zoneW/2)*100)+'%';z.style.width=(G.zoneW*100)+'%';}
function updateHud(){$('#hudScore').textContent=G.score;$('#hudStreak').textContent=G.streak;$('#hudLives').innerHTML=Array.from({length:3},(_,i)=>`<span class="life ${i<G.lives?'':'dead'}"></span>`).join('');}
function loop(now){if(!G.running)return;const dt=Math.min(50,now-G.last)/1000;G.last=now;G.pos+=G.dir*G.speed*dt;if(G.pos>=1){G.pos=1;G.dir=-1;}if(G.pos<=0){G.pos=0;G.dir=1;}$('#cursor').style.left=(G.pos*100)+'%';G.raf=requestAnimationFrame(loop);}
function floater(txt,color){const f=$('#floater');f.textContent=txt;f.style.color=color||'var(--amber)';f.classList.remove('go');void f.offsetWidth;f.classList.add('go');}
function tap(){if(!G.running)return;const half=G.zoneW/2,d=Math.abs(G.pos-G.zoneC),rail=$('#rail');rail.classList.remove('hit','miss');void rail.offsetWidth;if(d<=half){const acc=1-d/half;const perfect=acc>.8;const pts=Math.round((10+15*acc)*(1+Math.min(G.streak,12)*.1));G.score+=pts;G.hits++;G.streak++;rail.classList.add('hit');perfect?SFX.perfect(G.streak):SFX.hit(G.streak);floater(perfect?'PARFAIT +'+pts:'+'+pts,perfect?'var(--ok)':'var(--amber)');const s=$$('.screw')[(G.hits-1)%SCREWS];if(s)s.classList.add('set');G.speed=Math.min(2.4,G.speed*1.065);G.zoneW=Math.max(.055,G.zoneW*.955);newZone();}else{G.lives--;G.streak=0;rail.classList.add('miss');SFX.miss();floater('RATÉ','var(--red)');G.zoneW=Math.min(.34,G.zoneW*1.08);newZone();if(G.lives<=0)return endGame();}updateHud();}
$('#bench').addEventListener('pointerdown',e=>{e.preventDefault();tap();});
document.addEventListener('keydown',e=>{if((e.code==='Space'||e.code==='Enter')&&G.running){e.preventDefault();tap();}});

function tierOf(score){if(score>=(SETTINGS.thresholds?.or||600))return 'or';if(score>=(SETTINGS.thresholds?.argent||250))return 'argent';return 'bronze';}
function pickPrize(tier){const order=['or','argent','bronze'];const start=order.indexOf(tier);for(let i=start;i<order.length;i++){const pool=PRIZES.filter(p=>p.active&&p.tier===order[i]&&p.stock>0&&(!p.exp||new Date(p.exp)>=new Date()));if(!pool.length)continue;const total=pool.reduce((s,p)=>s+(+p.weight||1),0);let r=Math.random()*total;for(const p of pool){r-=(+p.weight||1);if(r<=0)return p;}return pool[pool.length-1];}return null;}

let CURRENT=null;
async function endGame(){
  G.running=false;cancelAnimationFrame(G.raf);
  const tier=tierOf(G.score);
  tier==='bronze'?SFX.over():SFX.win();
  const prize=pickPrize(tier);
  CURRENT={score:G.score,hits:G.hits,tier,prize};

  // Sauvegarder la partie en base
  try {
    await sbPost('plays',{session_id:SESSION,score:G.score,hits:G.hits,tier,valid:true});
    todayPlays++;
  } catch(e) {
    // Fallback local si Supabase pas encore configuré
    todayPlays++;
    localStorage.setItem('nh_today_'+today(), todayPlays);
  }
  refreshPlays();

  $('#resScore').textContent=G.score;
  $('#resLine').textContent=`Points · ${G.hits} vis posée${G.hits>1?'s':''}`;
  $('#resTier').textContent='Palier '+tier;
  $('#resDot').style.background=tier==='or'?'var(--amber)':tier==='argent'?'#A9B7BC':'#B0704A';
  $('#prizeName').textContent=prize?prize.name:'Bon de -10 % sur ta prochaine réparation';
  $('#prizeVal').textContent=prize&&prize.value&&prize.value!=='—'?'Valeur '+prize.value:'';
  $('#prizeLbl').textContent=tier==='or'?'Beau geste. Ton cadeau':'Ton cadeau';
  $('#rankBtn').disabled=false;$('#pseudo').value='';
  setTimeout(()=>go('result'),480);
}

function renderPrizes(){
  $('#prizeList').innerHTML=PRIZES.map(p=>`<div class="adm-item"><span class="pill ${p.tier}">${p.tier}</span><span class="nm">${esc(p.name)}</span><span class="meta">stock ${p.stock} · poids ${p.weight} · ${esc(p.value||'—')}${p.exp?' · exp. '+esc(p.exp):''}</span>${p.active?'':'<span class="pill off">désactivé</span>'}${p.stock<=0?'<span class="pill off">épuisé</span>':''}<span class="sp"><button class="mini" data-act="stock" data-id="${p.id}">Stock</button><button class="mini" data-act="weight" data-id="${p.id}">Poids</button><button class="mini" data-act="toggle" data-id="${p.id}">${p.active?'Désactiver':'Activer'}</button><button class="mini danger" data-act="del" data-id="${p.id}">Supprimer</button></span></div>`).join('');
  $$('[data-act]').forEach(b=>b.addEventListener('click',()=>prizeAction(b.dataset.act,b.dataset.id)));
}
async function prizeAction(act,id){
  const p=PRIZES.find(x=>x.id===id);if(!p)return;
  if(act==='toggle')p.active=!p.active;
  if(act==='del'){if(!confirm('Supprimer « '+p.name+' » ?'))return;PRIZES.splice(PRIZES.indexOf(p),1);}
  if(act==='stock'){const v=prompt('Nouveau stock',p.stock);if(v===null)return;p.stock=Math.max(0,parseInt(v)||0);}
  if(act==='weight'){const v=prompt('Poids de tirage',p.weight);if(v===null)return;p.weight=Math.max(1,parseInt(v)||1);}
  try{await sbFetch('config?key=eq.prizes',{method:'PATCH',body:{value:PRIZES},prefer:'return=representation'},true);}catch(e){toast('Erreur de sauvegarde — Supabase non configuré');}
  renderPrizes();renderHome();toast('Cadeaux mis à jour et sauvegardés ✓');
}
